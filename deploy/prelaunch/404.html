<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#061633">
  <title>Página no encontrada | Academia Ramón Sánchez</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/brand/escudo-oficial.svg">
  <link rel="stylesheet" href="/assets/css/prelaunch.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px 20px}
    .error-inner{width:min(100%,560px)}
    .error-inner img{width:145px;height:145px;object-fit:contain;margin-bottom:30px}
    .error-code{font-size:12px;letter-spacing:.23em;color:#b4d9ff;font-weight:800}
    .error-title{font-size:clamp(33px,6vw,52px);line-height:1.13;letter-spacing:-.055em;margin:18px 0}
    .error-description{font-size:16px;line-height:1.7;color:#c4d7ee}
    .error-home{display:inline-block;margin-top:22px;padding:12px 23px;border:1px solid rgba(186,217,249,.5);border-radius:9px;color:#f7fbff;text-decoration:none;font-size:14px;font-weight:750}
    .error-home:hover,.error-home:focus-visible{background:rgba(255,255,255,.08);outline:2px solid #b4d9ff;outline-offset:3px}
  </style>
</head>
<body>
<main class="launch error-page">
  <div class="error-inner">
    <img src="/assets/img/brand/escudo-oficial.svg" alt="Escudo oficial de la Academia Ramón Sánchez" width="145" height="145">
    <p class="error-code">ERROR 404</p>
    <h1 class="error-title">Esta página no está en nuestra cancha.</h1>
    <p class="error-description">La dirección que buscas no existe. Nuestra academia sigue aquí, construyendo algo grande para la comunidad.</p>
    <a class="error-home" href="/">Volver al inicio</a>
  </div>
</main>
</body>
</html>
